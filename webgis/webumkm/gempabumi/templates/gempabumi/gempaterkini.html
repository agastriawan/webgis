<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Gempa Terkini (M 5.0+)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #1e293b; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: #132a4a;
            color: #fff;
            height: 60px;
        }
        header h1 { margin: 0; font-size: 18px; }
        header .subtitle { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
        .reload-btn {
            background: #254b7c;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .reload-btn:hover { background: #31609c; }
        .layout { display: flex; height: calc(100vh - 60px); }
        .sidebar {
            width: 360px;
            overflow-y: auto;
            border-right: 1px solid #e2e8f0;
            background: #fff;
        }
        .gempa-item {
            display: flex;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.15s;
        }
        .gempa-item:hover { background: #f8fafc; }
        .mag-badge {
            min-width: 38px;
            height: 28px;
            border-radius: 6px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }
        .gempa-info .wilayah { font-weight: 700; font-size: 13px; line-height: 1.35; }
        .gempa-info .meta { font-size: 12px; color: #64748b; margin-top: 4px; }
        .error-box {
            margin: 16px;
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 6px;
            font-size: 13px;
        }
        #map { flex: 1; height: 100%; }
        .legend {
            background: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            font-size: 12px;
            line-height: 1.6;
        }
        .legend h4 { margin: 0 0 6px 0; font-size: 13px; color: #0f172a; }
        .legend-row { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .legend-note { margin-top: 6px; font-size: 11px; color: #64748b; }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <header>
        <div>
            <h1>15 Gempa Terkini (M 5.0+)</h1>
            <div class="subtitle">{{ gempa_list|length }} gempa M 5.0+ terakhir &middot; diperbarui {{ updated_at }}</div>
        </div>
        <button class="reload-btn" onclick="window.location.reload()">Muat ulang</button>
    </header>

    <div class="layout">
        <aside class="sidebar">
            {% if error_msg %}
                <div class="error-box">{{ error_msg }}</div>
            {% endif %}
            {% for g in gempa_list %}
                <div class="gempa-item" onclick="focusGempa({{ g.no }})">
                    <div class="mag-badge" style="background: {{ g.color }};">{{ g.magnitude }}</div>
                    <div class="gempa-info">
                        <div class="wilayah">{{ g.wilayah }}</div>
                        <div class="meta">{{ g.no }}. {{ g.tanggal }} {{ g.jam }} &middot; {{ g.kedalaman }}</div>
                    </div>
                </div>
            {% endfor %}
        </aside>
        <div id="map"></div>
    </div>

    <script>
        const gempaData = {{ gempa_json|safe }};
        const batasIndonesia = [[-11.5, 94.5], [6.5, 141.5]];

        const map = L.map("map", {
            minZoom: 4,
            maxBounds: [[-15, 88], [10, 148]],
            maxBoundsViscosity: 0.8
        }).fitBounds(batasIndonesia);

        const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Data gempa: <a href="https://data.bmkg.go.id/gempabumi/" target="_blank">BMKG</a>'
        }).addTo(map);

        const satelit = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 19, attribution: "Tiles &copy; Esri | Data gempa: BMKG" }
        );

        const markerMap = {};
        const gempaLayer = L.featureGroup().addTo(map);

        gempaData.forEach((g) => {
            const radius = Math.max(6, (g.mag_num - 3.5) * 3.5);
            const marker = L.circleMarker([g.lat, g.lon], {
                radius: radius,
                color: "#ffffff",
                weight: 1.5,
                fillColor: g.color,
                fillOpacity: 0.85
            }).bindPopup(`
                <div style="min-width: 210px; font-size: 13px;">
                    <b>M ${g.magnitude} &mdash; ${g.wilayah}</b><br>
                    <hr style="margin: 6px 0; border: 0; border-top: 1px solid #e2e8f0;">
                    <b>Waktu:</b> ${g.tanggal}, ${g.jam}<br>
                    <b>Kedalaman:</b> ${g.kedalaman} (${g.depth_label})<br>
                    <b>Koordinat:</b> ${g.lintang}, ${g.bujur}<br>
                    <b>Potensi:</b> ${g.potensi || "-"}
                </div>
            `).addTo(gempaLayer);

            markerMap[g.no] = marker;
        });

        L.control.layers(
            { "OpenStreetMap": osm, "Citra Satelit": satelit },
            { "15 Gempa Terkini": gempaLayer }
        ).addTo(map);
        L.control.scale({ imperial: false }).addTo(map);

        const legend = L.control({ position: "bottomright" });
        legend.onAdd = function () {
            const div = L.DomUtil.create("div", "legend");
            div.innerHTML = `
                <h4>Kedalaman</h4>
                <div class="legend-row"><span class="dot" style="background:#d63031;"></span> Dangkal (&lt; 70 km)</div>
                <div class="legend-row"><span class="dot" style="background:#e67e22;"></span> Menengah (70&ndash;300 km)</div>
                <div class="legend-row"><span class="dot" style="background:#27ae60;"></span> Dalam (&gt; 300 km)</div>
                <div class="legend-note">Ukuran lingkaran = magnitudo</div>
            `;
            return div;
        };
        legend.addTo(map);

        function focusGempa(no) {
            const marker = markerMap[no];
            if (marker) {
                map.flyTo(marker.getLatLng(), 7, { duration: 0.7 });
                marker.openPopup();
            }
        }
    </script>
</body>
</html>
